name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["notes/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["notes/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run mid-push; superseded PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (pytest)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-branch --cov-report=term-missing

  build:
    name: Build, smoke-test, push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}
      PUSH: ${{ github.event_name == 'push' }}
    outputs:
      image: ${{ env.IMAGE }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      pushed: ${{ env.PUSH }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Decide tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: yapp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - start container and call /health
        run: |
          docker run -d --name yapp-smoke -p 8000:8000 yapp:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; echo "healthy after ~$((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "::error::Container did not become healthy"
          docker logs yapp-smoke
          exit 1

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  summary:
    name: Summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAGS: ${{ needs.build.outputs.tags }}
          DIGEST: ${{ needs.build.outputs.digest }}
          PUSHED: ${{ needs.build.outputs.pushed }}
        run: |
          {
            echo "## 🐳 yapp image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` on \`${GITHUB_REF_NAME}\` |"
            echo "| Pushed to Docker Hub | ${PUSHED} |"
            echo "| Digest | \`${DIGEST:-not pushed}\` |"
            echo
            echo "**Tags**"
            echo '```'
            echo "${TAGS}"
            echo '```'
            if [ "${PUSHED}" = "true" ]; then
              echo "**Pull it**"
              echo '```bash'
              echo "docker pull ${IMAGE}@${DIGEST}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
