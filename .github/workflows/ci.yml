name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["notes/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["notes/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run mid-push; superseded PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (pytest)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-branch --cov-report=term-missing

  build:
    name: Image
    needs: test
    uses: ./.github/workflows/_build.yml
    with:
      tags: |
        type=sha,prefix=sha-
        type=ref,event=branch
        type=ref,event=pr
      push: ${{ github.event_name == 'push' }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  summary:
    name: Summary
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Write job summary
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAGS: ${{ needs.build.outputs.tags }}
          DIGEST: ${{ needs.build.outputs.digest }}
          PUSHED: ${{ needs.build.outputs.pushed }}
        run: |
          {
            echo "## 🐳 yapp image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` on \`${GITHUB_REF_NAME}\` |"
            echo "| Pushed to Docker Hub | ${PUSHED} |"
            echo "| Digest | \`${DIGEST:-not pushed}\` |"
            echo
            echo "**Tags**"
            echo '```'
            echo "${TAGS}"
            echo '```'
            if [ "${PUSHED}" = "true" ]; then
              echo "**Pull it**"
              echo '```bash'
              echo "docker pull ${IMAGE}@${DIGEST}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
