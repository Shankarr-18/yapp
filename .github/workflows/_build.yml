name: Build image (reusable)

on:
  workflow_call:
    inputs:
      tags:
        description: "docker/metadata-action tag rules, one per line"
        type: string
        required: true
      push:
        description: "Push to Docker Hub after the smoke test"
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      image:
        description: "Image name without tag, e.g. docker.io/shankar180/yapp"
        value: ${{ jobs.build.outputs.image }}
      tags:
        description: "All tags applied, one per line"
        value: ${{ jobs.build.outputs.tags }}
      digest:
        description: "sha256 digest of the pushed image (empty if not pushed)"
        value: ${{ jobs.build.outputs.digest }}
      pushed:
        description: "true if the image was pushed"
        value: ${{ jobs.build.outputs.pushed }}

permissions:
  contents: read

jobs:
  build:
    name: Build, smoke-test, push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}
    outputs:
      image: ${{ env.IMAGE }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      pushed: ${{ inputs.push }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Decide tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags }}

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: yapp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - start container and call /health
        run: |
          docker run -d --name yapp-smoke -p 8000:8000 yapp:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; echo "healthy after ~$((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "::error::Container did not become healthy"
          docker logs yapp-smoke
          exit 1

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        id: push
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
